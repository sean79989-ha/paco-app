function lpa(){

  $$('.m').forEach(b=>b.onclick=()=>{

function lbu(){

  const draw=()=>{
    const rest=pool.filter(t=>!ans.includes(t));
    $('#ans').innerHTML=ans.map(t=>`<button class="tok">${t[1]}</button>`).join('');
    $('#pool').innerHTML=rest.map(t=>`<button class="tok">${t[1]}</button>`).join('');
    $$('#ans .tok').forEach((b,k)=>b.onclick=()=>{ans.splice(k,1);draw()});
    $$('#pool .tok').forEach((b,k)=>b.onclick=()=>{ans.push(rest[k]);draw()});
    $('#chk').disabled=!ans.length;
  };draw();

}

}

function photoScene(id){
  const P=PH[id],bx=k=>`left:${P[k].x}%;top:${P[k].y}%;width:${P[k].w}%;height:${P[k].h}%`,im=k=>`<img src="${P[k].d}" alt="">`,h=P.head,

}

function vq(ws,n){const V=vocab(),all=Object.values(V);return sh(ws.filter(w=>V[w])).slice(0,n).map(w=>{const v=V[w],d=sh(all.filter(x=>x.es!==w)).slice(0,3);return Math.random()<.4?{q:`Wie sagst du „${v.de}“ auf Spanisch?`,a:v.es,o:[v.es,...d.map(x=>x.es)],w}:{q:`Was heißt „${v.es}“?`,a:v.de,o:[v.de,...d.map(x=>x.de)],w}})}
async function aq(topic,n){try{const j=await J('Erstelle '+n+' Multiple-Choice-Übungen zum Thema "'+topic+'" für eine deutschsprachige Spanisch-Lernende (Niveau '+((P.es&&P.es.lvl)||'A1')+'). Nur JSON: {"items":[{"q":"Aufgabe auf Deutsch mit spanischem Satz","o":["a","b","c","d"],"a":"richtige Option, identisch mit einer aus o"}]}');return(j.items||[]).filter(x=>x.o&&x.o.includes(x.a)).map(x=>({...x,t:'gram',topic}))}catch(e){return[]}}
async function openRev(){pv('🔄 Wiederholung','<p class="sub2">Paco analysiert deine letzten 2 Wochen …</p>');const k=weak(),ws=k.ws.map(x=>x[0]),V=Object.keys(vocab());let o=[];
 try{const j=await J('Du bist Paco. Daten der letzten 2 Wochen einer Spanisch-Lernenden: Fehlerwörter [Fehler, Versuche] '+JSON.stringify(k.ws)+', Aufgabentypen [Fehler, Versuche] '+JSON.stringify(k.t)+', Grammatikfehler (Chat und Quiz) '+JSON.stringify(k.g)+'. Plane genau 4 verschiedene Wiederholungs-Schwerpunkte. Nur JSON: {"opts":[{"title":"kurz","why":"ein Satz, duzend","words":["spanische Wörter, nur aus den Fehlerwörtern"],"topic":"Grammatikthema oder leer"}]}');o=(j.opts||[]).slice(0,4)}catch(e){}
 const T=['Deine Top-Fehlerwörter','Noch wacklige Wörter','Schwächster Aufgabentyp','Grammatik-Schwäche'];
 for(let i=o.length;i<4;i++)o.push(i===3&&k.g[0]?{title:'Grammatik: '+k.g[0][0],why:'Hier sind dir im Chat oder Quiz Fehler passiert.',words:[],topic:k.g[0][0]}:{title:T[i],why:ws.length?'Diese Wörter liefen zuletzt nicht rund.':'Frisch dran bleiben.',words:ws.length?ws.slice(i*3,i*3+4):sh(V).slice(0,4),topic:''});
 const run=async(it,tit)=>{pv(tit,'<p class="sub2">Quiz wird gebaut …</p>');const it2=await it();qz(tit,sh(it2),openRev)};
 pv('🔄 Wiederholung',`<p class="sub2">Pacos Plan aus deinen letzten 2 Wochen. Such dir einen Schwerpunkt aus:</p>${o.map((x,i)=>`<button class="rc" data-o="${i}"><b>${esc(x.title)}</b><small>${esc(x.why||'')}</small></button>`).join('')}<button class="rc" id="rg" style="border-color:var(--ink)"><b>🎯 Generelle Wiederholung</b><small>Mix aus deinen größten Schwächen und den letzten 5 Lektionen, sehr intensiv</small></button>`);
 $$('[data-o]').forEach(b=>b.onclick=()=>{const x=o[+b.dataset.o];run(async()=>[...vq(x.words||[],8),...(x.topic?await aq(x.topic,5):[])],x.title)});
 $('#rg').onclick=()=>run(async()=>{const lw=started().slice(-5).flatMap(i=>rowsU(i).map(p=>p[0]));return[...vq(ws,10),...vq(lw,14),...(k.g[0]?await aq(k.g[0][0],4):[])]},'Generelle Wiederholung')}
const GT={0:['Begrüßungen und Smalltalk (¿Qué tal?)'],1:['Artikel un/una/unos und Bestellen mit quiero'],2:['Präpositionen a / en / por'],3:['Personalpronomen','ser und estar','Präsens der wichtigsten Verben']};
function openGram(){const k=weak(),nw=started().flatMap(i=>(GT[i]||[]).map(g=>[g,U[i].n]));
 pv('🧩 Grammatik',`<div class="wsec">Empfohlen für dich</div>${k.g.length?k.g.map(g=>`<button class="rc" data-g="${esc(g[0])}"><b>${esc(g[0])}</b><small>${g[1]}× Fehler in den letzten 2 Wochen</small></button>`).join(''):'<small>Noch keine Fehler erkannt. Schreib mit Paco oder mach Lektionen, dann wird es persönlich.</small>'}<div class="wsec">Neu gelernt</div>${nw.length?nw.map(g=>`<button class="rc" data-g="${esc(g[0])}"><b>${esc(g[0])}</b><small>aus: ${esc(g[1])}</small></button>`).join(''):'<small>Starte eine Lektion, dann erscheinen hier passende Übungen.</small>'}`);
 $$('[data-g]').forEach(b=>b.onclick=async()=>{const g=b.dataset.g;pv(g,'<p class="sub2">Übungen werden gebaut …</p>',openGram);qz(g,await aq(g,6),openGram)})}
const BCP={es:'es-ES',fr:'fr-FR',ar:'ar-LB'};
const spk=(t,l)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();u.lang=l;const v=vs.find(v=>v.lang===l)||vs.find(v=>v.lang.slice(0,2)===l.slice(0,2));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}};
const listen=(l,cb)=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){gt('Spracheingabe wird hier nicht unterstützt');return}const r=new R();r.lang=l;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>gt('Mikro nicht verfügbar');r.start()};
async function trans(x,from,to){const j=await J('Übersetze natürlich aus '+from+' nach '+to+': "'+x+'". Nur JSON: {"t":"Übersetzung","hint":"kurzer Hinweis zu Register oder Aussprache, sonst leer"}');return j}
function openTr(){const L=LANGS[lang].n,lc=BCP[lang]||'es-ES';
 pv('🧠 Paco Übersetzer',`<p class="sub2">Paco übersetzt nur. Deutsch ⇄ ${L}.</p><div class="tabs"><button data-m="t" class="on">Text</button><button data-m="d">Live-Dialog</button></div><div id="tb"></div>`);
 const mode=m=>{$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m==='t'){$('#tb').innerHTML=`<select class="lang" id="td" style="margin:0"><option value="0">Deutsch → ${L}</option><option value="1">${L} → Deutsch</option></select><textarea class="tin" id="ti" placeholder="Text eingeben …"></textarea><div class="wrow"><button class="gb o" id="tm">🎤</button><button class="gb" id="tg">Übersetzen</button></div><div id="to"></div>`;
   const dir=()=>$('#td').value==='1';$('#tm').onclick=()=>listen(dir()?lc:'de-DE',s=>{$('#ti').value=s});
   $('#tg').onclick=async()=>{const x=$('#ti').value.trim();if(!x)return;$('#to').innerHTML='<p class="sub2">…</p>';try{const r=await trans(x,dir()?L:'Deutsch',dir()?'Deutsch':L);$('#to').innerHTML=`<div class="wcard"><b dir="auto" style="font-size:20px">${esc(r.t)}</b>${r.hint?`<br><small>${esc(r.hint)}</small>`:''}<br><button class="spk" id="ts">🔊</button></div>`;$('#ts').onclick=()=>spk(r.t,dir()?'de-DE':lc)}catch(e){$('#to').innerHTML='<small>Paco-KI gerade nicht erreichbar.</small>'}}}
  else{$('#tb').innerHTML=`<p class="sub2">Tippe auf dein Mikro und sprich, Paco übersetzt und liest laut vor. Dein Gegenüber nutzt das andere Mikro.</p><div class="wrow"><button class="gb" id="d1">🎤 Ich spreche Deutsch</button><button class="gb o" id="d2">🎤 Gegenüber spricht ${L}</button></div><div class="wc" id="dl"></div>`;
   const turn=(from,to,fl,tl)=>listen(fl,async s=>{const d=document.createElement('div');d.className='wb me';d.textContent=s;$('#dl').appendChild(d);try{const r=await trans(s,from,to);const e=document.createElement('div');e.className='wb';e.dir='auto';e.innerHTML='<b>'+esc(r.t)+'</b>';$('#dl').appendChild(e);spk(r.t,tl)}catch(x){gt('Paco-KI gerade nicht erreichbar')}});
   $('#d1').onclick=()=>turn('Deutsch',L,'de-DE',lc);$('#d2').onclick=()=>turn(L,'Deutsch',lc,'de-DE')}};
 $$('.tabs button').forEach(b=>b.onclick=()=>mode(b.dataset.m));mode('t')}
$('#rnav').onclick=openRev;$('#vnav').onclick=openVoc;$('#gnav').onclick=openGram;$('#tnav').onclick=openTr;

</script>
</body>
