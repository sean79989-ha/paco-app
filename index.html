es:{n:'Spanisch',f:'🇪🇸',note:'',g:[['¡Buenos días! ☀️ ¿Qué tal? ¿Qué planes tienes para hoy?','','¿Qué tal? ¿Qué planes tienes para hoy?'],['¡Ey, buenas! <span class="wave">👋</span> ¿Qué has hecho hoy?','','¿Qué has hecho hoy?'],['¡Buenas! 🌙 ¿Qué tal el día? ¿Qué has hecho hoy?','','¿Qué tal el día? ¿Qué has hecho hoy?']]},
fr:{n:'Französisch',f:'🇫🇷',wip:1,note:'',g:[['Bonjour ! ☀️ Qu’est-ce que tu as prévu aujourd’hui ?','','Qu’est-ce que tu as prévu aujourd’hui ?'],['Bonjour ! <span class="wave">👋</span> Qu’as-tu fait aujourd’hui ?','','Qu’as-tu fait aujourd’hui ?'],['Bonsoir ! 🌙 Qu’as-tu fait aujourd’hui ?','','Qu’as-tu fait aujourd’hui ?']]},
ar:{n:'Arabisch (Libanon)',f:'🇱🇧',wip:1,note:' Sprich libanesisches Arabisch (Dialekt, kein Hocharabisch). Schreibe in arabischer Schrift und setze die Lautschrift in lateinischen Buchstaben in Klammern dahinter.',g:[['صباح الخير! ☀️ شو ناوي تعمل اليوم؟','Sabah el khair! Shou nawi ta3mel el yom?','شو ناوي تعمل اليوم؟'],['نهارك سعيد! <span class="wave">👋</span> شو عملت اليوم؟','Naharak sa3id! Shou 3melit el yom?','شو عملت اليوم؟'],['مساء الخير! 🌙 شو عملت اليوم؟','Masa el khair! Shou 3melit el yom?','شو عملت اليوم؟']]}};

const GF={
es:[['¡Buenos días! ☀️ ¿Qué planes tiene para hoy?','','¿Qué planes tiene para hoy?'],['¡Buenas tardes! ¿Qué ha hecho hoy?','','¿Qué ha hecho hoy?'],['¡Buenas noches! ¿Qué hizo hoy?','','¿Qué hizo hoy?']],
fr:[['Bonjour ! ☀️ Qu’avez-vous prévu aujourd’hui ?','','Qu’avez-vous prévu aujourd’hui ?'],['Bonjour ! Qu’avez-vous fait aujourd’hui ?','','Qu’avez-vous fait aujourd’hui ?'],['Bonsoir ! Qu’avez-vous fait aujourd’hui ?','','Qu’avez-vous fait aujourd’hui ?']],

let tone='locker';try{tone=localStorage.getItem('pacoTone')==='formell'?'formell':'locker'}catch(e){}
const G=()=>(tone==='formell'?GF[lang]:LANGS[lang].g)[part()];
const DX=()=>(tone==='formell'?DEF:DE)[part()];
const TONE=()=>tone==='formell'?'Du bist Paco, ein höflicher, professioneller Sprachlehrer. Die Lernenden sind meist 15 bis 30 und brauchen die Sprache für wichtige Situationen wie Uni, Bewerbung, Praktikum, Arbeit, Behörden oder E-Mails. Trainiere deshalb den formellen Sprachgebrauch: Anrede mit usted bzw. der Höflichkeitsform, saubere Satzstellung, passende Formeln für E-Mails, Vorstellungsgespräche und Präsentationen. Sprich sachlich, klar und respektvoll, ohne Slang und mit höchstens einem Emoji. Keine Überschriften.':'Du bist Paco, ein lockerer Sprachkumpel und KI-Gesprächspartner, der sich wie ein guter Freund verhält. Die Lernenden sind Gen Z, meist 15 bis 30. Bring ihnen die Sprache so bei, wie junge Leute vor Ort sie wirklich sprechen: Umgangssprache, gängiger Slang, Abkürzungen, Chat-Sprache und typische Redewendungen, immer mit tú. Markiere Slang kurz mit „(Slang)“, damit klar ist, wo er passt, und erkläre bei Bedarf, dass es im Gespräch mit Profs oder Chefs formeller klingen muss. Weise bei regionalen Unterschieden (z. B. Spanien vs. Lateinamerika) kurz darauf hin. Duze auf Deutsch, sprich locker mit Humor, kurzen Sätzen und passenden Emojis (ein bis drei pro Antwort). Kein Professoren-Ton, keine Überschriften.';
const AV=()=>lang==='es'?(tone==='formell'?'🤵':'😎'):'🧑‍🏫';
const LV=['A0','A1','A2','B1','B2','C1'];
let P={};try{P=JSON.parse(localStorage.getItem('pacoProf')||'{}')}catch(e){}

function bestV(f){let sv='';try{sv=localStorage.getItem('pacoVoice')||''}catch(e){}const vs=esV();return vs.find(v=>v.name===sv)||[...vs].sort((a,b)=>vsc(b,f)-vsc(a,f))[0]}
function fillV(){const el=$('#wv');if(!el||!NS)return;const f=LOOK[NS.id][0]==='f',vs=esV().sort((a,b)=>vsc(b,f)-vsc(a,f));el.style.display=vs.length?'':'none';el.innerHTML=vs.map(v=>`<option>${v.name}</option>`).join('');const b=bestV(f);if(b)el.value=b.name;el.onchange=()=>{try{localStorage.setItem('pacoVoice',el.value)}catch(e){}const l=NS.h.filter(x=>x.role==='assistant').pop();npcVoice(l?l.content:NPC[NS.id].o,NS.id)}}

function npcVoice(text,id){
  try{speechSynthesis.cancel();if(!TTS)return;const f=LOOK[id][0]==='f',v=bestV(f),parts=text.split(/(?<=[.!?])\s+/).filter(Boolean);let n=parts.length;
    parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);if(v){u.voice=v;u.lang=v.lang}else u.lang='es-ES';u.pitch=f?1.02:.92;u.rate=.84;
      u.onstart=()=>$('#pt')&&$('#pt').classList.add('talk');u.onend=u.onerror=()=>{if(--n<=0&&$('#pt'))$('#pt').classList.remove('talk')};speechSynthesis.speak(u)})}catch(e){}
}
function mic(){

}

function photoScene(id){
  const dust=Array.from({length:9},(_,i)=>`<i class="dp" style="left:${8+i*10}%;top:${55+(i*13)%35}%;animation-delay:-${i*1.1}s"></i>`).join('');
  return `<div class="sc ph"><div class="phi" style="background-image:url(${PH[id]})"><div class="win"><svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice"><g style="animation:wp 18s linear infinite"><g transform="translate(0 0) scale(.42)">${JET}</g></g></svg></div><div class="lf"><svg viewBox="0 0 80 60" preserveAspectRatio="xMidYMax slice">${ppl(0,58,.95,'#1d2b44','#222',24,1,0)}${ppl(0,50,.7,'#3a2a2a','#445',30,-1,-9)}${ppl(0,44,.55,'#222','#335',36,1,-18)}</svg></div><div class="phm" id="pt"></div></div><div class="glare"></div>${dust}`;
}
function openNpc(id){
  NS={id,h:[],t:0,busy:0};const n=NPC[id],sc=SC[W.at]||SC.cafe,ms=MS.find(m=>m[1]===W.d&&!W.mdone.includes(m[0])&&m[4].includes(id));
  $('#les').innerHTML=`<div class="wh2"><button class="x" id="wback">←</button><div><b>${n.n}</b><small>${n.job}, ${relL(id)}</small></div><button class="gb o" id="wend" style="margin-left:auto" disabled>Beenden</button></div>
  ${PH[id]?photoScene(id):`<div class="sc">${W.at==='air'?`<div class="bgx" style="inset:0;filter:blur(1.4px)">${AIR}</div>`:`<div class="bgx" style="background:${bokeh(sc[1])},${sc[0]}"></div>`}<div class="pt" id="pt">${portrait(id)}</div>`}${ms?`<div class="msn">🎯 ${ms[2]}</div>`:''}<select class="wctl" id="wv" aria-label="Stimme"></select><button class="wctl" id="wsp" aria-label="Ton">${TTS?'🔊':'🔇'}</button><div class="sbt" id="sub"></div></div>
  <div class="wc" id="wc"></div><div class="wi"><input id="wt" placeholder="Antworte auf Spanisch oder sprich per Mikro…" autocomplete="off"><button class="gb o" id="wm" aria-label="Sprechen">🎤</button><button class="gb" id="ws">Senden</button></div>`;
  fillV();wb(esc(n.o),'');$('#sub').textContent=n.o;npcVoice(n.o,id);
  $('#wback').onclick=()=>{speechSynthesis.cancel();worldHome()};$('#ws').onclick=wsend;$('#wend').onclick=wfin;$('#wm').onclick=mic;
  $('#wsp').onclick=()=>{TTS=TTS?0:1;$('#wsp').textContent=TTS?'🔊':'🔇';if(TTS){const l=NS.h.filter(x=>x.role==='assistant').pop();npcVoice(l?l.content:n.o,id)}else speechSynthesis.cancel()};
  $('#wt').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)wsend()};$('#wt').focus();
}
function wb(h,c){const d=document.createElement('div');d.className='wb '+c;d.innerHTML=h;$('#wc').appendChild(d);$('#les').scrollTop=1e5;return d}
async function wsend(){
  const el=$('#wt'),tx=el.value.trim();if(!tx||NS.busy)return;el.value='';NS.busy=1;
  wb(esc(tx),'me');NS.h.push({role:'user',content:tx});NS.t++;
  const b=wb('<span class="dots">…</span>','');
  try{
    if(!sample)sample=await claude.use('sample');
    const turns=NS.h.map((m,i)=>({role:m.role,content:i===0?npcSys(NS.id)+'\n\nNachricht der Person:\n'+m.content:m.content}));
    const r=await sample(turns,{cache:false,onText:({text})=>{b.innerHTML=esc(text);$('#sub').textContent=text}});
    b.innerHTML=esc(r.text);$('#sub').textContent=r.text;NS.h.push({role:'assistant',content:r.text});npcVoice(r.text,NS.id);
  }catch(e){NS.h.pop();NS.t--;b.innerHTML='<span class="err">Keine Antwort. Versuch es nochmal.</span>'}
  NS.busy=0;$('#wend').disabled=false;
}
async function wfin(){
  try{speechSynthesis.cancel()}catch(e){}
  const n=NPC[NS.id];$('#les').innerHTML='<div class="lend"><p>Auswertung…</p></div>';
  let f={good:['Du hast das Gespräch durchgezogen.'],practice:[],vocab:[],facts:''};
  try{const j=await sample.json('Analysiere ein Gespräch einer deutschsprachigen Spanisch-Lernenden (Niveau '+((P.es&&P.es.lvl)||'A1')+'). Ihre Nachrichten:\n'+NS.h.filter(m=>m.role==='user').map(m=>'- '+m.content).join('\n')+'\nAntworte nur als JSON: {"good":["max 3 kurze deutsche Stichpunkte"],"practice":["max 2 kurze deutsche Stichpunkte"],"vocab":[["spanisch","deutsch"]],"facts":"persönliche Fakten der Lernenden (Name, Herkunft) in einem deutschen Satz, sonst leer"}',{cache:false,modelTier:'quick'});Object.assign(f,j)}catch(e){}
  const xp=Math.min(60,15+NS.t*8),A=x=>Array.isArray(x)?x:[];
  addXp(xp);W.convs++;W.rel[NS.id]=(W.rel[NS.id]||0)+1;if(!W.talked.includes(NS.id))W.talked.push(NS.id);if(f.facts)W.mem[NS.id]=String(f.facts).slice(0,200);
  const dn=[];MS.forEach(m=>{if(!W.mdone.includes(m[0])&&m[4].every(x=>W.talked.includes(x))){W.mdone.push(m[0]);addXp(m[5]);LP.spent-=m[6];dn.push(m)}});
  svW();svL();renderHud();
  $('#les').innerHTML=`<div class="lend"><h2>Gespräch beendet</h2><p>+${xp} XP mit ${n.n}</p></div><div class="wcard"><h3>Das lief gut</h3>${A(f.good).map(x=>'<p class="wreq">✓ '+esc(String(x))+'</p>').join('')}</div>${A(f.practice).length?`<div class="wcard"><h3>Nochmal üben</h3>${A(f.practice).map(x=>'<p class="wreq">○ '+esc(String(x))+'</p>').join('')}</div>`:''}${A(f.vocab).length?`<div class="wcard"><h3>Neue Wörter</h3>${A(f.vocab).map(v=>'<p class="wreq"><b>'+esc(String(v[0]))+'</b> ('+esc(String(v[1]))+')</p>').join('')}</div>`:''}${dn.map(m=>`<div class="wcard"><h3>Mission geschafft: ${m[2]}</h3><small>+${m[5]} XP, +${m[6]} 🪙</small></div>`).join('')}<div class="lend"><div class="bt"><button class="gb" id="wcont">Weiter</button></div></div>`;
  $('#wcont').onclick=worldHome;
}
$('#wbg').onclick=expandMap;bgMap();
$('#wnav').onclick=()=>{openWorld();$('#side').classList.remove('open')};

welcome();
</script>
